# Cabeceras de seguridad. nginx NO hereda add_header en un bloque que defina el suyo,
# por eso este archivo se incluye en el server y en cada location que añada cabeceras.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# El script solo se ejecuta desde el propio origen (sin inline ni eval): es la barrera contra XSS.
# img/connect admiten https: porque los mapas, las capas WMS/ArcGIS configuradas por administración,
# las teselas y las fotos de GBIF/iNaturalist viven en orígenes que cambian.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self' https:; worker-src 'self' blob:; frame-src 'none'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests" always;
