<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VIGIA-IIAP — Visor Gestor de Información del Instituto de Investigaciones Ambientales del Pacífico</title>
    <meta name="description" content="Plataforma web para la gestión, visualización y distribución de información ambiental del Chocó Biogeográfico colombiano." />

    <!-- Google Search Console — verificación de propiedad del dominio, requisito
         de la verificación de marca OAuth de Google. -->
    <meta name="google-site-verification" content="Ah7Q2d0qQouzIzGlxdT2gxrK0Ec5tK5NaiL49mW-m7w" />

    <!-- Open Graph -->
    <meta property="og:type"        content="website" />
    <meta property="og:title"       content="VIGIA-IIAP — Visor Gestor de Información Ambiental del Pacífico" />
    <meta property="og:description" content="Plataforma web para la gestión, visualización y distribución de información ambiental del Chocó Biogeográfico colombiano." />
    <meta property="og:image"       content="/og-image.svg" />
    <meta property="og:locale"      content="es_CO" />

    <!-- Twitter/X Card -->
    <meta name="twitter:card"        content="summary_large_image" />
    <meta name="twitter:title"       content="VIGIA-IIAP — Visor Gestor de Información Ambiental" />
    <meta name="twitter:description" content="Gestión y visualización de información ambiental del Chocó Biogeográfico colombiano." />
    <meta name="twitter:image"       content="/og-image.svg" />

    <!-- PWA / Browser -->
    <meta name="theme-color" content="#1B4332" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.svg" />

    <!-- Fuentes cargadas via @fontsource (auto-hospedadas, sin CDN externo) -->
  </head>
  <body>
    <!-- Contenido de respaldo sin JavaScript — VIGIA-IIAP es una SPA de React,
         así que el HTML servido antes de hidratar no tiene texto en el body
         (solo <div id="root">). Verificadores automatizados que leen el HTML
         crudo sin ejecutar JavaScript (como el de verificación de marca OAuth
         de Google) no veían ni el nombre ni el propósito de la app. Este
         bloque nunca se muestra con JS activo — React lo reemplaza al montar
         sobre #root — pero queda en el HTML servido para ese tipo de lector. -->
    <noscript>
      <main style="max-width: 640px; margin: 4rem auto; padding: 0 1.5rem; font-family: system-ui, sans-serif; color: #1a1a1a;">
        <h1>VIGIA-IIAP — Visor y Gestor de Información Ambiental</h1>
        <p>
          VIGIA-IIAP es la plataforma digital del Instituto de Investigaciones Ambientales del
          Pacífico "John von Neumann" (IIAP) para la gestión, visualización y distribución de
          información ambiental del Chocó Biogeográfico colombiano: mapas temáticos, documentos
          técnicos, herramientas SIG (geovisores) y trámites institucionales, todo en un solo
          lugar, con acceso público para consulta y acceso institucional para investigadores y
          entidades aliadas.
        </p>
        <p>Active JavaScript en su navegador para usar la plataforma completa.</p>
      </main>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
