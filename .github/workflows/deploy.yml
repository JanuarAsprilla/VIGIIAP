name: Deploy

# Se dispara solo cuando el workflow CI ya terminó (y pasó) sobre main —
# nunca se construye ni despliega una imagen que no pasó lint/tests/build/E2E.
on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build y publicar imagen
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login en GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build y push de la imagen
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/vigiiap-frontend:latest
            ghcr.io/${{ github.repository_owner }}/vigiiap-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Desplegar en el servidor
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: SSH y recrear el contenedor con la imagen nueva
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /root/vigiiap
            docker compose pull frontend
            docker compose up -d frontend
            docker image prune -f
