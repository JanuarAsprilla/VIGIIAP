name: CI

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

jobs:
  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint

  test:
    name: Tests y cobertura
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run test:coverage
      - name: Subir reporte de cobertura
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  build:
    name: Build de producción
    runs-on: ubuntu-latest
    needs: [typecheck, lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Subir artefacto de build
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: dist
          path: dist/
          retention-days: 7

  e2e:
    name: E2E — Playwright
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # authenticated.spec.ts necesita un backend real (no hay staging), así que
      # las credenciales y la URL de producción SOLO se pasan en push a
      # develop/main (post-merge) — nunca en pull_request. Un PR (incluso de una
      # rama propia del repo) no debe tener sesión admin real contra producción
      # ni acceso a estos secrets; en PRs, authenticated.spec.ts simplemente
      # hace skip vía su propio test.skip() por falta de credenciales.
      - run: npm run build
        env:
          VITE_API_URL: ${{ github.event_name == 'push' && 'https://vigiiap-backend.onrender.com/api/v1' || '' }}
      - name: Servir build y ejecutar tests E2E
        run: npx playwright test e2e/public.spec.ts e2e/auth.spec.ts e2e/authenticated.spec.ts
        env:
          CI: true
          E2E_ADMIN_EMAIL: ${{ github.event_name == 'push' && secrets.E2E_ADMIN_EMAIL || '' }}
          E2E_ADMIN_PASSWORD: ${{ github.event_name == 'push' && secrets.E2E_ADMIN_PASSWORD || '' }}
          E2E_USER_EMAIL: ${{ github.event_name == 'push' && secrets.E2E_USER_EMAIL || '' }}
          E2E_USER_PASSWORD: ${{ github.event_name == 'push' && secrets.E2E_USER_PASSWORD || '' }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  audit:
    name: Auditoría de seguridad
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
        continue-on-error: true
