name: CI

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

# Mínimo privilegio por defecto: ningún job de este pipeline necesita
# escribir en el repo (solo checkout, build, test y subir artefactos).
permissions:
  contents: read

jobs:
  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint

  test:
    name: Tests y cobertura
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run test:coverage
      - name: Subir reporte de cobertura
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  build:
    name: Build de producción
    runs-on: ubuntu-latest
    needs: [typecheck, lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Subir artefacto de build
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: dist
          path: dist/
          retention-days: 7

  e2e:
    name: E2E — Playwright
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # authenticated.spec.ts necesita un backend real (no hay staging), así que
      # las credenciales y la URL de producción SOLO se pasan en push a
      # develop/main (post-merge) — nunca en pull_request. Un PR (incluso de una
      # rama propia del repo) no debe tener sesión admin real contra producción
      # ni acceso a estos secrets; en PRs, authenticated.spec.ts simplemente
      # hace skip vía su propio test.skip() por falta de credenciales.
      #
      # IMPORTANTE: en PR, VITE_API_URL debe quedar sin definir (no ""). api.ts
      # usa `?? '/api/v1'`, y `??` solo cae al fallback con null/undefined —
      # un string vacío pasa de largo y rompe la rehidratación de sesión contra
      # una ruta que no existe en el preview server (visto en CI: los 4 tests
      # de redirección de auth.spec.ts quedaban colgados hasta timeout).
      - name: Build
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            export VITE_API_URL="https://vigiiap-backend.onrender.com/api/v1"
          fi
          npm run build
      - name: Servir build y ejecutar tests E2E
        run: npx playwright test e2e/public.spec.ts e2e/auth.spec.ts e2e/authenticated.spec.ts
        env:
          CI: true
          E2E_ADMIN_EMAIL: ${{ github.event_name == 'push' && secrets.E2E_ADMIN_EMAIL || '' }}
          E2E_ADMIN_PASSWORD: ${{ github.event_name == 'push' && secrets.E2E_ADMIN_PASSWORD || '' }}
          E2E_USER_EMAIL: ${{ github.event_name == 'push' && secrets.E2E_USER_EMAIL || '' }}
          E2E_USER_PASSWORD: ${{ github.event_name == 'push' && secrets.E2E_USER_PASSWORD || '' }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  audit:
    name: Auditoría de seguridad
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high

  secrets-scan:
    name: Escaneo de secretos
    runs-on: ubuntu-latest
    # gitleaks-action lista los commits de la PR vía API para decidir qué
    # rango escanear — sin este permiso la llamada devuelve 403 y el job
    # falla aunque no haya ningún secreto real en el diff.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
