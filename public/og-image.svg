<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#0d2818"/>
  <!-- Subtle grid -->
  <defs>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#1B4332" stroke-width="0.8" opacity="0.6"/>
    </pattern>
    <radialGradient id="glow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#1B4332" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0d2818" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <ellipse cx="600" cy="315" rx="500" ry="350" fill="url(#glow)"/>

  <!-- Logo mark -->
  <g transform="translate(580, 140)">
    <path d="M20 0 C20 0 0 12 0 26 C0 36 7 44 20 44 C33 44 40 36 40 26 C40 12 20 0 20 0Z" fill="#52B788" opacity="0.9"/>
    <path d="M20 0 C20 0 25 10 25 20 C25 28 23 34 20 38 C17 34 15 28 15 20 C15 10 20 0 20 0Z" fill="#D8F3DC" opacity="0.8"/>
    <circle cx="20" cy="26" r="3.5" fill="#D4A373"/>
    <circle cx="20" cy="26" r="1.5" fill="#0d2818"/>
  </g>

  <!-- Title -->
  <text x="600" y="265" text-anchor="middle"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="64" font-weight="700"
    fill="#D8F3DC" letter-spacing="2">VIGIA-IIAP</text>

  <!-- Subtitle -->
  <text x="600" y="320" text-anchor="middle"
    font-family="system-ui, -apple-system, sans-serif"
    font-size="22" font-weight="400"
    fill="#52B788" letter-spacing="1" opacity="0.9">
    Visor y Gestor de Información Ambiental del Pacífico
  </text>

  <!-- Divider -->
  <line x1="360" y1="350" x2="840" y2="350" stroke="#1B4332" stroke-width="1.5" opacity="0.8"/>

  <!-- Description -->
  <text x="600" y="390" text-anchor="middle"
    font-family="system-ui, -apple-system, sans-serif"
    font-size="18" fill="#86efac" opacity="0.75">
    Chocó Biogeográfico — Instituto de Investigaciones Ambientales del Pacífico
  </text>

  <!-- Bottom badge -->
  <rect x="480" y="440" width="240" height="42" rx="21" fill="#1B4332" opacity="0.8"/>
  <text x="600" y="467" text-anchor="middle"
    font-family="system-ui, -apple-system, sans-serif"
    font-size="15" font-weight="600" fill="#D8F3DC" letter-spacing="3">
    IIAP · Colombia
  </text>
</svg>
